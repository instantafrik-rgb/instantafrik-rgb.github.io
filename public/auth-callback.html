<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Connexion - StockFacture Pro</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body { font-family: system-ui, sans-serif; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; background: #FAFAF8; color: #14213D; }
    .box { text-align: center; padding: 2rem; }
    .spinner { width: 40px; height: 40px; border: 4px solid #E8EDF2; border-top-color: #F97316; border-radius: 50%; animation: spin 1s linear infinite; margin: 0 auto 1rem; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="box">
    <div class="spinner"></div>
    <p id="status">Connexion en cours...</p>
  </div>

  <script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js';
    import { getAuth, signInWithPopup, GoogleAuthProvider } from 'https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js';

    // ⚠️ REMPLACEZ par votre configuration Firebase (depuis firebase-applet-config.json)
    const firebaseConfig = {
      apiKey: "AIzaSyCa9KvRnsv1rf0m7GMD-0Wlvi8mxnvh0Ds",
      authDomain: "stockfacture-pro.firebaseapp.com",
      projectId: "stockfacture-pro",
      storageBucket: "stockfacture-pro.appspot.com",
      messagingSenderId: "809570746761",
      appId: "1:809570746761:web:86aa6fa7dc8b415865a158"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const provider = new GoogleAuthProvider();

    async function doLogin() {
      try {
        const result = await signInWithPopup(auth, provider);
        const credential = GoogleAuthProvider.credentialFromResult(result);
        const idToken = credential.idToken;

        // Redirige vers Electron avec le jeton
        window.location.href = `stockfacture://auth/callback?idToken=${encodeURIComponent(idToken)}`;
        document.getElementById('status').textContent = 'Redirection vers l\'application...';
      } catch (error) {
        document.getElementById('status').textContent = 'Erreur : ' + error.message;
        console.error(error);
      }
    }

    // Lance la connexion automatiquement
    doLogin();
  </script>
</body>
</html>
