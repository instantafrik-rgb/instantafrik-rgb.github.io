name: Deploy Vite React to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Installer les dépendances (déterministe)
        run: npm ci

      - name: Construire l'application
        run: npm run build

      - name: Vérifier que assetlinks.json est bien dans le build
        run: |
          ls -la dist/.well-known/
          test -f dist/.well-known/assetlinks.json && echo "✅ assetlinks.json trouvé" || exit 1

      - name: Configurer GitHub Pages
        uses: actions/configure-pages@v5

      - name: Créer un tarball incluant les fichiers cachés
        run: |
          cd dist
          tar \
            --dereference --hard-dereference \
            --directory . \
            -cvf "$RUNNER_TEMP/artifact.tar" \
            --exclude=.git \
            --exclude=.github \
            --exclude=".[^/]*" \
            . || true
          # On refait le tar sans l'exclusion des fichiers cachés
          tar \
            --dereference --hard-dereference \
            --directory . \
            -cvf "$RUNNER_TEMP/artifact.tar" \
            --exclude=.git \
            --exclude=.github \
            .
          cd ..

      - name: Upload du build
        uses: actions/upload-artifact@v4
        with:
          name: github-pages
          path: ${{ runner.temp }}/artifact.tar
          retention-days: 1

      - name: Déployer sur GitHub Pages
        uses: actions/deploy-pages@v4
